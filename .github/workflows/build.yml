name: Build ZipToApk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # 1) build the template APK (the empty WebView shell)
      - name: Build template APK
        run: gradle :template:assembleRelease --no-daemon

      # 2) bundle template + signing key into the builder app's assets
      - name: Bundle template and signing key
        run: |
          mkdir -p app/src/main/assets
          cp template/build/outputs/apk/release/template-release-unsigned.apk app/src/main/assets/template.apk
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair \
            -keystore app/src/main/assets/zip2apk.p12 -storetype PKCS12 \
            -storepass zip2apk -keypass zip2apk -alias zip2apk \
            -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=ZipToApk"

      # 3) build the builder app
      - name: Build ZipToApk
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZipToApk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 4) publish as a Release so the APK can be downloaded straight from a phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZipToApk build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
